spring.application.name=explora2-backend
server.port=8089

# Conexión MySQL (XAMPP) + creación automática de la BD si no existe
spring.datasource.url=jdbc:mysql://localhost:3306/explora2_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=America/Santiago&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=

# Creación/actualización automática de las tablas (@Entity)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true